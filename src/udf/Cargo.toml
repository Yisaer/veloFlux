[package]
publish = false
name = "udf"
version = "0.0.1"
edition = "2021"

[dependencies]
flow = { path = "../flow" }
datatypes = { path = "../datatypes" }
# Preserve Wasmtime 36's default features except the unused disk compilation cache.
wasmtime = { version = "36.0.19", default-features = false, features = [
    "async",
    "gc",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "threads",
    "stack-switching",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
wat = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
