[package]
publish = false
name = "udf"
version = "0.0.1"
edition = "2021"

[dependencies]
flow = { path = "../flow" }
datatypes = { path = "../datatypes" }
wasmtime = "36.0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
wat = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
