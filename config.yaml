properties: {}

profiling:
  enabled: true
  addr: "0.0.0.0:6060"

metrics:
  # Enable stage handling-time histograms for diagnostics (adds per-callback overhead).
  stage_handling_time_enabled: false
  poll_interval_secs: 5

server:
  manager_addr: "0.0.0.0:8080"
  flow_instances:
    - id: default
      backend: in_process
