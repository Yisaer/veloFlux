properties:
  vin: "L123456789"
  site_code: "cn"

# Optional runtime overrides from the local MQTT broker at 127.0.0.1:1883.
# The final topic level is the declared property key.
# property_registry:
#   mqtt:
#     topic: "$local/notification/+"

logging:
  output: stdout
  level: info
  include_source: true
  disable_timestamp: false
  file:
    dir: "./logs"
    file_name: "app.log"
    rotation:
      keep_days: 7
      max_num: 30
      max_size_mb: 256
  syslog:
    enable: false
    level: info
    tag: "veloflux"
    # Use an explicit Unix datagram socket path.
    network: unixgram
    address: /var/run/syslog

profiling:
  enabled: true
  addr: "0.0.0.0:6060"
  cpu_profile_freq_hz: 100

metrics:
  poll_interval_secs: 5

server:
  manager_addr: "0.0.0.0:8080"
  flow_instances:
    - id: "default"
      backend: "in_process"
      runtime:
        thread_name_prefix: "vf-default"
