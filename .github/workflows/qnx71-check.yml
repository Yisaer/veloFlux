name: QNX 7.1 Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: qnx71-check
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  QNX_INSTALL_DIR: /opt/qnx710
  QNX_QSC_DIR: /opt/qnxsoftwarecenter
  QNX_RUST_TOOLCHAIN: qnx7
  QNX_SDP_IMAGE: ghcr.io/emqx/veloflux-qnx-sdp:7.1-try
  QNX_VM_ASSET_SHA256: 51de37d71fa21673431ddc549929ef9a6ab54ee6557d3309819d41305554b1d8
  QNX_TARGET_TRIPLE: aarch64-unknown-nto-qnx710

jobs:
  qnx71-aarch64-smoke:
    name: Run veloFlux in QNX 7.1 ARM64 QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull QNX 7.1 SDP image
        run: docker pull "$QNX_SDP_IMAGE"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: .cargo-cache
          key: qnx71-check-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            qnx71-check-cargo-${{ runner.os }}-

      - name: Build QNX 7.1 ARM64 release binary
        env:
          QNX_71_LICENSE_KEY: ${{ secrets.QNX_71_LICENSE_KEY }}
          QNX_71_MYQNX_USER: ${{ secrets.QNX_71_MYQNX_USER }}
          QNX_71_MYQNX_PASSWORD: ${{ secrets.QNX_71_MYQNX_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$QNX_71_LICENSE_KEY"
          test -n "$QNX_71_MYQNX_USER"
          test -n "$QNX_71_MYQNX_PASSWORD"
          mkdir -p "$PWD/.cargo-cache/registry" "$PWD/.cargo-cache/git"

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_BUILD_JOBS=2 \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -e CARGO_HOME=/workspace/.cargo-cache \
            -e QNX_INSTALL_DIR \
            -e QNX_QSC_DIR \
            -e QNX_RUST_TOOLCHAIN \
            -e QNX_TARGET_TRIPLE \
            -e QNX_71_LICENSE_KEY \
            -e QNX_71_MYQNX_USER \
            -e QNX_71_MYQNX_PASSWORD \
            "$QNX_SDP_IMAGE" \
            bash -lc '
              set -euo pipefail

              qnx_license_activation_attempted=false
              cleanup() {
                status=$?
                set +e

                if [ "$qnx_license_activation_attempted" = true ]; then
                  deactivated=false
                  for attempt in $(seq 1 20); do
                    echo "Attempt $attempt/20 to deactivate QNX 7.1 licenses"
                    if timeout 180s "$QNX_QSC_DIR/qnxsoftwarecenter/qnxsoftwarecenter_clt" \
                      -deactivateAll \
                      -myqnx.user "$QNX_71_MYQNX_USER" \
                      -myqnx.password "$QNX_71_MYQNX_PASSWORD"; then
                      deactivated=true
                      echo "QNX 7.1 license deactivation succeeded on attempt $attempt/20"
                      break
                    fi
                    echo "QNX 7.1 license deactivation failed on attempt $attempt/20" >&2
                    if [ "$attempt" -lt 20 ]; then
                      sleep 10
                    fi
                  done
                  if [ "$deactivated" != true ]; then
                    echo "QNX 7.1 license deactivation failed after 20 attempts" >&2
                    status=1
                  fi
                fi

                exit "$status"
              }
              trap cleanup EXIT

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                curl \
                git \
                libprotobuf-dev \
                m4 \
                pkg-config \
                protobuf-compiler

              qsc_bin="$QNX_QSC_DIR/qnxsoftwarecenter/qnxsoftwarecenter_clt"
              test -x "$qsc_bin"
              qnx_license_activation_attempted=true
              "$qsc_bin" \
                -addLicenseKey "$QNX_71_LICENSE_KEY" \
                -myqnx.user "$QNX_71_MYQNX_USER" \
                -myqnx.password "$QNX_71_MYQNX_PASSWORD"

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable
              source "$CARGO_HOME/env"

              QNX_RUST_TC_DIR="/opt/qnx-rust-toolchain"
              curl -fsSL \
                https://github.com/qorix-group/rust-lang-qnx8/releases/download/1.3.0/qnx7_rust_toolchain.tar.gz \
                -o /tmp/qnx7_rust_toolchain.tar.gz
              mkdir -p "$QNX_RUST_TC_DIR"
              tar -xzf /tmp/qnx7_rust_toolchain.tar.gz -C "$QNX_RUST_TC_DIR" --strip-components=1
              rm -f /tmp/qnx7_rust_toolchain.tar.gz

              if [ ! -x "$QNX_RUST_TC_DIR/bin/rustc" ]; then
                inner="$(find "$QNX_RUST_TC_DIR" -maxdepth 3 -type f -name rustc -perm -111 | head -n 1)"
                test -n "$inner"
                QNX_RUST_TC_DIR="$(dirname "$(dirname "$inner")")"
              fi

              rustup toolchain link "$QNX_RUST_TOOLCHAIN" "$QNX_RUST_TC_DIR"
              cargo +"$QNX_RUST_TOOLCHAIN" -V
              rustc +"$QNX_RUST_TOOLCHAIN" -Vv

              source "$QNX_INSTALL_DIR/qnxsdp-env.sh"
              qcc -Vgcc_ntoaarch64le_cxx -E -xc /dev/null >/dev/null

              cargo +"$QNX_RUST_TOOLCHAIN" build \
                --release \
                --target "$QNX_TARGET_TRIPLE" \
                --no-default-features \
                --features allocator-system,metrics
            '

      - name: Download ARM64 QNX VM asset
        env:
          QNX_INSTALLER_TOKEN: ${{ secrets.QNX_INSTALLER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$QNX_INSTALLER_TOKEN"
          mkdir -p tmp/qnx710-aarch64-vm
          GH_TOKEN="$QNX_INSTALLER_TOKEN" gh release download qnx-sdp-8-installer \
            --repo Yisaer/qnx-private-assets \
            --pattern qnx710-aarch64-vm-dist.tar.gz \
            --dir tmp/qnx710-aarch64-vm
          mv tmp/qnx710-aarch64-vm/qnx710-aarch64-vm-dist.tar.gz \
            tmp/qnx710-aarch64-vm.tar.gz
          echo "$QNX_VM_ASSET_SHA256  tmp/qnx710-aarch64-vm.tar.gz" | sha256sum --check --strict
          tar -xzf tmp/qnx710-aarch64-vm.tar.gz --strip-components=1 -C tmp/qnx710-aarch64-vm
          test -x tmp/qnx710-aarch64-vm/scripts/start-vm.sh
          test -f tmp/qnx710-aarch64-vm/image/ifs.bin
          test -f tmp/qnx710-aarch64-vm/image/disk-qemu

      - name: Prepare ARM64 binary
        run: |
          set -euo pipefail
          binary="target/${QNX_TARGET_TRIPLE}/release/veloflux"
          test -x "$binary"
          cp "$binary" tmp/veloflux-bin
          file tmp/veloflux-bin

      - name: Run ARM64 QNX smoke test
        run: |
          set -euo pipefail
          mkdir -p tmp/qnx710-aarch64-run
          docker pull "$QNX_SDP_IMAGE"
          docker run --rm --privileged --network host \
            -v "$PWD/tmp/qnx710-aarch64-vm:/vm" \
            -v "$PWD/tmp:/workspace" -w /workspace \
            "$QNX_SDP_IMAGE" bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends qemu-system-arm qemu-utils
              export RUN_DIR=/workspace/qnx710-aarch64-run
              export VM_OUTPUT_DIR=/vm/image
              export HOST_QCONN_PORT=8001
              export LOG_FILE=/workspace/qnx710-aarch64-console.log
              export PIDFILE=/workspace/qnx710-aarch64-run/qemu.pid
              /vm/scripts/start-vm.sh > /workspace/qnx710-aarch64-start.log 2>&1 &
              vm_pid=$!
              cleanup() {
                status=$?
                set +e
                kill "$vm_pid" 2>/dev/null || true
                wait "$vm_pid" 2>/dev/null || true
                exit "$status"
              }
              trap cleanup EXIT

              deadline=$((SECONDS + 300))
              while [ "$SECONDS" -lt "$deadline" ]; do
                kill -0 "$vm_pid" 2>/dev/null || {
                  cat /workspace/qnx710-aarch64-start.log >&2
                  exit 1
                }
                if timeout 5 bash -c ": </dev/tcp/127.0.0.1/8001" 2>/dev/null; then
                  break
                fi
                sleep 5
              done
              timeout 5 bash -c ": </dev/tcp/127.0.0.1/8001"
              source "$QNX_INSTALL_DIR/qnxsdp-env.sh"
              gdb="$(command -v ntoaarch64-gdb)"
              gdb_log=/workspace/qnx710-aarch64-gdb.log
              : > "$gdb_log"
              smoke_passed=false

              for attempt in $(seq 1 20); do
                echo "GDB smoke attempt $attempt/20"
                set +e
                timeout 150s "$gdb" -q -batch \
                  -ex "target qnx 127.0.0.1:8001" \
                  -ex "upload /workspace/veloflux-bin /data/home/root/apps/veloflux" \
                  -ex "file /workspace/veloflux-bin" \
                  -ex "run --help" 2>&1 | tee -a "$gdb_log"
                status="${PIPESTATUS[0]}"
                set -e
                if grep -q "manager listening" "$gdb_log"; then
                  smoke_passed=true
                  echo "GDB smoke attempt $attempt/20 succeeded (manager is listening)."
                  break
                fi
                echo "GDB smoke attempt $attempt/20 failed with exit code $status."
                if [ "$attempt" -lt 20 ]; then
                  echo "Waiting 5 seconds before retrying GDB..."
                  sleep 5
                fi
              done

              if [ "$smoke_passed" != true ]; then
                echo "QNX 7.1 ARM64 veloFlux smoke test failed after 20 GDB attempts." >&2
                exit 1
              fi
              echo "QNX 7.1 ARM64 veloFlux smoke test passed: manager is listening."
            '

      - name: Upload ARM64 QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnx71-aarch64-smoke-logs
          path: |
            tmp/qnx710-aarch64-start.log
            tmp/qnx710-aarch64-console.log
            tmp/qnx710-aarch64-gdb.log
          if-no-files-found: warn
