name: CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COVERAGE_THRESHOLD: 50
  # Limit parallel jobs to prevent memory exhaustion during linking
  CARGO_BUILD_JOBS: 2
  CARGO_HOME: /home/runner/.cargo
  CARGO_INCREMENTAL: 0
  # Switch to LLD linker to reduce memory usage and speed up linking on CI
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  pr-title-lint:
    name: PR Title Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: make clippy

  test-core:
    name: Test Core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    services:
      nanomq:
        image: emqx/nanomq
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            curl \
            libprotobuf-dev \
            protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-core

      - name: Run root package tests
        run: cargo test --features deadlock_detection

      - name: Run datatypes tests
        run: cargo test -p datatypes --features deadlock_detection

      - name: Run manager tests
        run: cargo test -p manager --features deadlock_detection

      - name: Run parser tests
        run: cargo test -p parser --features deadlock_detection

      - name: Build veloflux binary for integration tests
        run: cargo build --bin veloflux --features deadlock_detection

  test-flow:
    name: Test Flow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    services:
      nanomq:
        image: emqx/nanomq
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            curl \
            libprotobuf-dev \
            protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-flow

      - name: Run flow tests
        run: cargo test -p flow --features deadlock_detection

  test-sdv:
    name: Test SDV
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    services:
      nanomq:
        image: emqx/nanomq
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            curl \
            libprotobuf-dev \
            protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-sdv

      - name: Build veloflux binary for SDV integration tests
        run: cargo build --bin veloflux --features deadlock_detection

      - name: Run SDV tests
        run: cargo test -p veloflux-sdv

  test-ffi-nng:
    name: Test FFI NNG Inproc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            curl \
            libprotobuf-dev \
            protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-ffi-nng

      - name: Verify FFI NNG inproc host integration
        run: bash scripts/ci/ffi_nng_inproc.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      nanomq:
        image: emqx/nanomq
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Generate coverage report
        run: |
          (
            source <(cargo llvm-cov show-env --sh)
            cargo llvm-cov clean --workspace
            cargo build --bin veloflux --features default --target-dir target/llvm-cov-target
          )
          export CARGO_BIN_EXE_veloflux="$PWD/target/llvm-cov-target/debug/veloflux"
          cargo llvm-cov --no-clean --workspace --features default --fail-under-lines ${{ env.COVERAGE_THRESHOLD }} --lcov --output-path lcov.info

      - name: Generate coverage summary
        if: always()
        run: |
          cargo llvm-cov report --summary-only

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          name: rust-llvm-cov
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
