name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      package_group:
        description: Package group to build
        required: true
        default: cross-release
        type: choice
        options:
          - cross-release
          - native-release
          - qnx71
          - ffi
          - all

jobs:
  build-and-upload:
    if: github.event_name == 'release' || github.event.inputs.package_group == 'native-release' || github.event.inputs.package_group == 'all'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_suffix: linux-x86_64-debug
            build_cmd: make build
            bin_path: target/debug/veloflux
            video_feature: "false"
          - runner: ubuntu-latest
            asset_suffix: linux-x86_64
            build_cmd: make release
            bin_path: target/release/veloflux
            video_feature: "false"
          - runner: ubuntu-latest
            asset_suffix: linux-x86_64-thin
            build_cmd: make release-thin
            bin_path: target/release-thin/veloflux
            video_feature: "false"
          - runner: ubuntu-latest
            asset_suffix: linux-x86_64-video
            build_cmd: cargo build --release --features video_gstreamer
            bin_path: target/release/veloflux
            video_feature: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install GStreamer build dependencies
        if: matrix.video_feature == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            pkg-config
      - name: Build release binary
        run: ${{ matrix.build_cmd }}
      - name: Prepare asset
        run: |
          BIN_PATH="${{ matrix.bin_path }}"
          ASSET_NAME="veloflux-${{ matrix.asset_suffix }}"
          cp "$BIN_PATH" "$ASSET_NAME"
          cp etc/config.example.yaml "${ASSET_NAME}.config.example.yaml"
          tar -czf "${ASSET_NAME}.tar.gz" "$ASSET_NAME" "${ASSET_NAME}.config.example.yaml"
          rm "$ASSET_NAME" "${ASSET_NAME}.config.example.yaml"
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: veloflux-${{ matrix.asset_suffix }}
          path: veloflux-${{ matrix.asset_suffix }}.tar.gz

  upload-release-assets:
    if: github.event_name == 'release'
    needs: build-and-upload
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asset_suffix:
          - linux-x86_64-debug
          - linux-x86_64
          - linux-x86_64-thin
          - linux-x86_64-video
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: veloflux-${{ matrix.asset_suffix }}
          path: .
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: veloflux-${{ matrix.asset_suffix }}.tar.gz

  build-and-upload-cross-release:
    if: github.event_name == 'release' || github.event.inputs.package_group == 'cross-release' || github.event.inputs.package_group == 'all'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_suffix: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            build_mode: linux-arm64-container
            video_feature: "false"
            bin_path: target/release-artifacts/linux-arm64/veloflux
          - asset_suffix: linux-arm64-video
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            build_mode: linux-arm64-container
            video_feature: "true"
            bin_path: target/release-artifacts/linux-arm64-video/veloflux
          - asset_suffix: android-arm64
            runner: ubuntu-latest
            rust_target: aarch64-linux-android
            build_mode: android-cross
            video_feature: "false"
            android_ndk_version: 26.3.11579264
            android_api_level: 24
            bin_path: target/release-artifacts/android-arm64/veloflux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build_mode != 'linux-arm64-container'
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        if: matrix.build_mode != 'linux-arm64-container'
      - uses: android-actions/setup-android@v4
        if: matrix.build_mode == 'android-cross'
        with:
          # Do not install the obsolete `tools` package (removed from the
          # SDK repository); `platform-tools` is enough since the NDK is
          # installed explicitly in the next step.
          packages: platform-tools
      - name: Install Android arm64 toolchain
        if: matrix.build_mode == 'android-cross'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential protobuf-compiler
          sdkmanager --install "ndk;${{ matrix.android_ndk_version }}"
          NDK="$ANDROID_HOME/ndk/${{ matrix.android_ndk_version }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ matrix.android_api_level }}"
          mkdir -p "$RUNNER_TEMP/cross-bin"
          ln -sf "$TOOLCHAIN/aarch64-linux-android${API}-clang" "$RUNNER_TEMP/cross-bin/aarch64-linux-android-gcc"
          ln -sf "$TOOLCHAIN/aarch64-linux-android${API}-clang++" "$RUNNER_TEMP/cross-bin/aarch64-linux-android-g++"
          ln -sf "$TOOLCHAIN/llvm-ar" "$RUNNER_TEMP/cross-bin/aarch64-linux-android-ar"
          ln -sf "$TOOLCHAIN/llvm-ranlib" "$RUNNER_TEMP/cross-bin/aarch64-linux-android-ranlib"
          ln -sf "$TOOLCHAIN/llvm-strip" "$RUNNER_TEMP/cross-bin/aarch64-linux-android-strip"
          ln -sf "$TOOLCHAIN/aarch64-linux-android${API}-clang" "$RUNNER_TEMP/cross-bin/aarch64-unknown-linux-android-gcc"
          ln -sf "$TOOLCHAIN/aarch64-linux-android${API}-clang++" "$RUNNER_TEMP/cross-bin/aarch64-unknown-linux-android-g++"
          ln -sf "$TOOLCHAIN/llvm-ar" "$RUNNER_TEMP/cross-bin/aarch64-unknown-linux-android-ar"
          ln -sf "$TOOLCHAIN/llvm-ranlib" "$RUNNER_TEMP/cross-bin/aarch64-unknown-linux-android-ranlib"
          ln -sf "$TOOLCHAIN/llvm-strip" "$RUNNER_TEMP/cross-bin/aarch64-unknown-linux-android-strip"
          echo "$RUNNER_TEMP/cross-bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C force-frame-pointers=yes" >> "$GITHUB_ENV"
      - name: Prebuild Android GMP cache
        if: matrix.build_mode == 'android-cross'
        run: |
          NDK="$ANDROID_HOME/ndk/${{ matrix.android_ndk_version }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ matrix.android_api_level }}"
          WRAPPER_DIR="$RUNNER_TEMP/android-gmp-wrapper"
          PREBUILD_DIR="$RUNNER_TEMP/android-gmp-prebuild"

          mkdir -p "$WRAPPER_DIR" "$PREBUILD_DIR/src"
          export ANDROID_TARGET_CC="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          export ANDROID_TARGET_CXX="$TOOLCHAIN/aarch64-linux-android${API}-clang++"
          export ANDROID_TARGET_AR="$TOOLCHAIN/llvm-ar"
          export ANDROID_TARGET_RANLIB="$TOOLCHAIN/llvm-ranlib"
          export GMP_MPFR_SYS_CACHE="$RUNNER_TEMP/gmp-mpfr-cache"
          HOST_CC="$(command -v gcc || true)"
          if [ -z "$HOST_CC" ]; then
            echo "Host C compiler 'gcc' not found in PATH" >&2
            exit 1
          fi
          export HOST_CC
          echo "GMP_MPFR_SYS_CACHE=$GMP_MPFR_SYS_CACHE" >> "$GITHUB_ENV"

          cat > "$WRAPPER_DIR/gcc" <<'EOF'
          #!/usr/bin/env bash
          for arg in "$@"; do
            case "$arg" in
              *gen-*.c) exec "$HOST_CC" "$@" ;;
            esac
          done
          exec "$ANDROID_TARGET_CC" "$@"
          EOF
          cat > "$WRAPPER_DIR/g++" <<'EOF'
          #!/usr/bin/env bash
          exec "$ANDROID_TARGET_CXX" "$@"
          EOF
          cat > "$WRAPPER_DIR/ar" <<'EOF'
          #!/usr/bin/env bash
          exec "$ANDROID_TARGET_AR" "$@"
          EOF
          cat > "$WRAPPER_DIR/ranlib" <<'EOF'
          #!/usr/bin/env bash
          exec "$ANDROID_TARGET_RANLIB" "$@"
          EOF
          chmod +x "$WRAPPER_DIR/gcc" "$WRAPPER_DIR/g++" "$WRAPPER_DIR/ar" "$WRAPPER_DIR/ranlib"

          cat > "$PREBUILD_DIR/Cargo.toml" <<'EOF'
          [package]
          name = "android-gmp-prebuild"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          gmp-mpfr-sys = { version = "=1.6.8", features = ["force-cross"] }
          EOF
          printf '' > "$PREBUILD_DIR/src/lib.rs"

          PATH="$WRAPPER_DIR:$PATH" cargo build --manifest-path "$PREBUILD_DIR/Cargo.toml" --target ${{ matrix.rust_target }}
      - name: Build Linux arm64 compatibility binary
        if: matrix.build_mode == 'linux-arm64-container'
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/workspace" \
            --workdir /workspace \
            rust:1.97.1-bullseye@sha256:02d78ca3f928195c2a907543de778adfd728ad7e2a24fdc6aef582b7c77842e0 \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              debian_snapshot="20260831T230000Z"
              video_gstreamer_packages=""
              if [ "${{ matrix.video_feature }}" = "true" ]; then
                video_gstreamer_packages="libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev"
              fi
              rm -f /etc/apt/sources.list.d/debian.sources
              printf "%s\n" \
                "deb https://snapshot.debian.org/archive/debian/$debian_snapshot bullseye main" \
                "deb https://snapshot.debian.org/archive/debian/$debian_snapshot bullseye-updates main" \
                "deb https://snapshot.debian.org/archive/debian-security/$debian_snapshot bullseye-security main" \
                > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get install -y --no-install-recommends \
                binutils \
                build-essential \
                ca-certificates \
                git \
                libprotobuf-dev \
                m4 \
                pkg-config \
                protobuf-compiler \
                $video_gstreamer_packages

              if [ "${{ matrix.video_feature }}" = "true" ]; then
                cargo build --release --features video_gstreamer
              else
                cargo build --release
              fi

              BIN="target/release/veloflux"
              max_glibc="$(readelf --version-info "$BIN" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -V | tail -n1)"
              echo "max GLIBC requirement: ${max_glibc:-none}"
              if [ -n "$max_glibc" ] && [ "$(printf "%s\n" "2.31" "$max_glibc" | sort -V | tail -n1)" != "2.31" ]; then
                echo "binary requires GLIBC_$max_glibc, expected GLIBC_2.31 or older" >&2
                exit 1
              fi

              mkdir -p target/release-artifacts/${{ matrix.asset_suffix }}
              cp "$BIN" target/release-artifacts/${{ matrix.asset_suffix }}/veloflux
              chown -R "$HOST_UID:$HOST_GID" target/release-artifacts
            '
      - name: Build cross release binary
        if: matrix.build_mode != 'linux-arm64-container'
        run: |
          cargo build --release --target ${{ matrix.rust_target }} --no-default-features --features "metrics,profiling,allocator-system"
          mkdir -p target/release-artifacts/${{ matrix.asset_suffix }}
          cp "target/${{ matrix.rust_target }}/release/veloflux" "target/release-artifacts/${{ matrix.asset_suffix }}/veloflux"
      - name: Prepare cross release asset
        run: |
          BIN_PATH="${{ matrix.bin_path }}"
          ASSET_NAME="veloflux-${{ matrix.asset_suffix }}"
          cp "$BIN_PATH" "$ASSET_NAME"
          cp etc/config.example.yaml "${ASSET_NAME}.config.example.yaml"
          tar -czf "${ASSET_NAME}.tar.gz" "$ASSET_NAME" "${ASSET_NAME}.config.example.yaml"
          rm "$ASSET_NAME" "${ASSET_NAME}.config.example.yaml"
      - name: Upload cross artifact
        uses: actions/upload-artifact@v6
        with:
          name: veloflux-${{ matrix.asset_suffix }}
          path: veloflux-${{ matrix.asset_suffix }}.tar.gz

  upload-cross-release-assets:
    if: github.event_name == 'release'
    needs: build-and-upload-cross-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asset_suffix:
          - linux-arm64
          - linux-arm64-video
          - android-arm64
    steps:
      - name: Download cross artifact
        uses: actions/download-artifact@v7
        with:
          name: veloflux-${{ matrix.asset_suffix }}
          path: .
      - name: Upload cross release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: veloflux-${{ matrix.asset_suffix }}.tar.gz

  build-and-upload-qnx71-release:
    if: github.event_name == 'release' || github.event.inputs.package_group == 'qnx71' || github.event.inputs.package_group == 'all'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QNX_SDP_IMAGE: ghcr.io/emqx/veloflux-qnx-sdp:7.1-try
      QNX_INSTALL_DIR: /opt/qnx710
      QNX_QSC_DIR: /opt/qnxsoftwarecenter
      QNX_RUST_TOOLCHAIN: qnx7
      QNX_TARGET_TRIPLE: aarch64-unknown-nto-qnx710
      QNX_ASSET_SUFFIX: qnx71-aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull QNX 7.1 SDP image
        run: docker pull "$QNX_SDP_IMAGE"

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: .cargo-cache
          key: qnx71-release-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            qnx71-release-cargo-${{ runner.os }}-

      - name: Build QNX 7.1 release binary
        env:
          QNX_71_LICENSE_KEY: ${{ secrets.QNX_71_LICENSE_KEY }}
          QNX_71_MYQNX_USER: ${{ secrets.QNX_71_MYQNX_USER }}
          QNX_71_MYQNX_PASSWORD: ${{ secrets.QNX_71_MYQNX_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$QNX_71_LICENSE_KEY"
          test -n "$QNX_71_MYQNX_USER"
          test -n "$QNX_71_MYQNX_PASSWORD"
          mkdir -p "$PWD/.cargo-cache/registry" "$PWD/.cargo-cache/git"

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_BUILD_JOBS=2 \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -e CARGO_HOME=/workspace/.cargo-cache \
            -e QNX_INSTALL_DIR \
            -e QNX_QSC_DIR \
            -e QNX_RUST_TOOLCHAIN \
            -e QNX_TARGET_TRIPLE \
            -e QNX_71_LICENSE_KEY \
            -e QNX_71_MYQNX_USER \
            -e QNX_71_MYQNX_PASSWORD \
            "$QNX_SDP_IMAGE" \
            bash -lc '
              set -euo pipefail

              qnx_license_active=false
              cleanup() {
                status=$?
                set +e

                if [ "$qnx_license_active" = true ]; then
                  deactivated=false
                  for attempt in $(seq 1 20); do
                    echo "Attempt $attempt/20 to deactivate QNX 7.1 licenses"
                    if timeout 180s "$QNX_QSC_DIR/qnxsoftwarecenter/qnxsoftwarecenter_clt" \
                      -deactivateAll \
                      -myqnx.user "$QNX_71_MYQNX_USER" \
                      -myqnx.password "$QNX_71_MYQNX_PASSWORD"; then
                      deactivated=true
                      break
                    fi
                    if [ "$attempt" -lt 20 ]; then
                      sleep 10
                    fi
                  done
                  if [ "$deactivated" != true ]; then
                    echo "QNX 7.1 license deactivation failed after 20 attempts" >&2
                    status=1
                  fi
                fi

                exit "$status"
              }
              trap cleanup EXIT

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                curl \
                git \
                libprotobuf-dev \
                m4 \
                pkg-config \
                protobuf-compiler

              qsc_bin="$QNX_QSC_DIR/qnxsoftwarecenter/qnxsoftwarecenter_clt"
              test -x "$qsc_bin"
              "$qsc_bin" \
                -addLicenseKey "$QNX_71_LICENSE_KEY" \
                -myqnx.user "$QNX_71_MYQNX_USER" \
                -myqnx.password "$QNX_71_MYQNX_PASSWORD"
              qnx_license_active=true

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable
              source "$CARGO_HOME/env"

              QNX_RUST_TC_DIR="/opt/qnx-rust-toolchain"
              curl -fsSL \
                https://github.com/qorix-group/rust-lang-qnx8/releases/download/1.3.0/qnx7_rust_toolchain.tar.gz \
                -o /tmp/qnx7_rust_toolchain.tar.gz
              mkdir -p "$QNX_RUST_TC_DIR"
              tar -xzf /tmp/qnx7_rust_toolchain.tar.gz -C "$QNX_RUST_TC_DIR" --strip-components=1
              rm -f /tmp/qnx7_rust_toolchain.tar.gz

              if [ ! -x "$QNX_RUST_TC_DIR/bin/rustc" ]; then
                inner="$(find "$QNX_RUST_TC_DIR" -maxdepth 3 -type f -name rustc -perm -111 | head -n 1)"
                test -n "$inner"
                QNX_RUST_TC_DIR="$(dirname "$(dirname "$inner")")"
              fi

              rustup toolchain link "$QNX_RUST_TOOLCHAIN" "$QNX_RUST_TC_DIR"
              cargo +"$QNX_RUST_TOOLCHAIN" -V
              rustc +"$QNX_RUST_TOOLCHAIN" -Vv

              source "$QNX_INSTALL_DIR/qnxsdp-env.sh"
              qcc -Vgcc_ntoaarch64le_cxx -E -xc /dev/null >/dev/null

              cargo +"$QNX_RUST_TOOLCHAIN" build \
                --release \
                --target "$QNX_TARGET_TRIPLE" \
                --no-default-features \
                --features allocator-system,metrics
            '

      - name: Prepare QNX 7.1 release asset
        run: |
          set -euo pipefail
          asset_name="veloflux-${QNX_ASSET_SUFFIX}"
          binary="target/${QNX_TARGET_TRIPLE}/release/veloflux"
          test -x "$binary"
          cp "$binary" "$asset_name"
          cp etc/config.example.yaml "${asset_name}.config.example.yaml"
          tar -czf "${asset_name}.tar.gz" \
            "$asset_name" \
            "${asset_name}.config.example.yaml"
          rm "$asset_name" "${asset_name}.config.example.yaml"

      - name: Upload QNX 7.1 release artifact
        uses: actions/upload-artifact@v6
        with:
          name: veloflux-${{ env.QNX_ASSET_SUFFIX }}
          path: veloflux-${{ env.QNX_ASSET_SUFFIX }}.tar.gz
          if-no-files-found: error

  upload-qnx71-release-assets:
    if: github.event_name == 'release'
    needs: build-and-upload-qnx71-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download QNX 7.1 release artifact
        uses: actions/download-artifact@v7
        with:
          name: veloflux-qnx71-aarch64
          path: .

      - name: Upload QNX 7.1 release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: veloflux-qnx71-aarch64.tar.gz

  build-and-upload-ffi:
    if: github.event_name == 'release' || github.event.inputs.package_group == 'ffi' || github.event.inputs.package_group == 'all'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Build Linux FFI shared library
        run: cargo build -p veloflux-ffi --release
      - name: Prepare FFI asset
        run: |
          ASSET_NAME="veloflux-ffi-linux-x86_64"
          mkdir -p "$ASSET_NAME"
          cp target/release/libveloflux_ffi.so "$ASSET_NAME/"
          cp src/ffi/include/veloflux_ffi.h "$ASSET_NAME/"
          tar -czf "${ASSET_NAME}.tar.gz" "$ASSET_NAME"
          rm -rf "$ASSET_NAME"
      - name: Upload FFI artifact
        uses: actions/upload-artifact@v6
        with:
          name: veloflux-ffi-linux-x86_64
          path: veloflux-ffi-linux-x86_64.tar.gz

  upload-ffi-release-assets:
    if: github.event_name == 'release'
    needs: build-and-upload-ffi
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download FFI artifact
        uses: actions/download-artifact@v7
        with:
          name: veloflux-ffi-linux-x86_64
          path: .
      - name: Upload FFI release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: veloflux-ffi-linux-x86_64.tar.gz
